backend:
  name: github
  repo: murali1277/cineconnect_web
  branch: main

media_folder: "frontend/public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "articles"
    label: "Cinema Articles & News"
    folder: "frontend/content/articles"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Header Subtitle", name: "header", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Cover Image URL", name: "coverImage", widget: "string", required: false }
      - { label: "Publish Date & Time", name: "date", widget: "string", default: "August 4, 2026 | 04:00 PM" }
      - { label: "Public Status", name: "public", widget: "boolean", default: true }
      - { label: "Sort Order", name: "sort", widget: "number", default: 1 }
      - { label: "Article Body", name: "body", widget: "markdown" }

  - name: "reviews"
    label: "Movie Reviews & Ratings"
    folder: "frontend/content/reviews"
    create: true
    slug: "{{slug}}-review"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Review Title", name: "title", widget: "string" }
      - { label: "Movie Name", name: "movieTitle", widget: "string" }
      - { label: "Star Rating (0.0 - 5.0)", name: "rating", widget: "number", value_type: "float", min: 0, max: 5, step: 0.5, default: 3.5 }
      - { label: "Verdict Summary", name: "verdict", widget: "string" }
      - { label: "Director", name: "director", widget: "string", required: false }
      - { label: "Cast Members", name: "cast", widget: "string", required: false }
      - { label: "Genre", name: "genre", widget: "string", required: false }
      - { label: "Cover Image URL", name: "coverImage", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "string", default: "August 2026" }
      - { label: "Public Status", name: "public", widget: "boolean", default: true }
      - { label: "Sort Order", name: "sort", widget: "number", default: 1 }
      - { label: "Review Body Text", name: "body", widget: "markdown" }

  - name: "web_stories"
    label: "Web Stories (Visual Cards)"
    folder: "frontend/content/web-stories"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Story Title", name: "title", widget: "string" }
      - { label: "Cover Image URL", name: "coverImage", widget: "string" }
      - { label: "Date", name: "date", widget: "string", default: "August 2026" }
      - { label: "Public Status", name: "public", widget: "boolean", default: true }
      - { label: "Sort Order", name: "sort", widget: "number", default: 1 }

  - name: "epapers"
    label: "Digital E-Papers"
    folder: "frontend/content/epapers"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "ID", name: "id", widget: "string" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Edition Title", name: "editionTitle", widget: "string" }
      - { label: "Cover Image URL", name: "coverImage", widget: "string" }
      - { label: "PDF Download URL", name: "pdfUrl", widget: "string" }
      - { label: "Date", name: "date", widget: "string", default: "August 2026" }
      - { label: "Public Status", name: "public", widget: "boolean", default: true }
      - { label: "Sort Order", name: "sort", widget: "number", default: 1 }

  - name: "banners"
    label: "Banner Inventory"
    files:
      - file: "frontend/content/banners/banners.json"
        label: "Banners List"
        name: "banners_list"
        fields:
          - name: "banners"
            label: "Banners"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Type", name: "type", widget: "select", options: ["promotion", "related", "adsense"] }
              - { label: "Image URL", name: "image", widget: "string", required: false }
              - { label: "Target URL", name: "url", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }

  - name: "placements"
    label: "Banner Placements"
    files:
      - file: "frontend/content/banners/placements.json"
        label: "Placements List"
        name: "placements_list"
        fields:
          - name: "placements"
            label: "Placements"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Banner ID", name: "bannerId", widget: "string" }
              - { label: "Area", name: "area", widget: "select", options: ["inline", "sidebar"] }
              - { label: "Position", name: "position", widget: "number", default: 1 }
              - { label: "Enabled", name: "enabled", widget: "boolean", default: true }
